[run]
seed = 7
tag = "smoke_test_only"
out_dir = "engravings_smoke"

[model]
n_cov = 6
d_model = 16
n_layers = 2
n_heads = 2
ffn_mult = 2
dropout = 0.0
mixture_components = 3
max_units = 16
max_time = 8
spillover_threshold = 0.0
use_unit_fe = true

[data]
kind = "synthetic"
n_units = 5
n_time = 4
n_cov = 6
n_families = 3
panels_per_epoch = 8
treat_fraction = 0.4
signal = 1.0
modifier_cov = 0
source_path = ""

[optim]
lr = 0.001
weight_decay = 0.0
warmup_epochs = 0
epochs = 2
batch_size = 2
grad_accum = 1
world_size = 1
grad_clip = 1.0
ema_decay = 0.9
precision = "fp32"

[hte]
k_max = 3
coherence_delta = 0.3
prototype_iters = 5

[evaluation]
alpha = 0.05
n_bootstrap = 50
n_seeds = 2
init_window = 1
