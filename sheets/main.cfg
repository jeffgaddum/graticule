[run]
seed = 20240101
tag = "main"
out_dir = "engravings"

[model]
n_cov = 52
d_model = 512
n_layers = 12
n_heads = 16
ffn_mult = 4
dropout = 0.1
mixture_components = 5
max_units = 256
max_time = 64
spillover_threshold = 0.0
use_unit_fe = true

[data]
kind = "synthetic"
n_units = 48
n_time = 24
n_cov = 52
n_families = 8
panels_per_epoch = 256
treat_fraction = 0.32
signal = 1.0
modifier_cov = 0
source_path = ""

[optim]
lr = 0.000002
weight_decay = 0.05
warmup_epochs = 30
epochs = 700
batch_size = 96
grad_accum = 6
world_size = 16
grad_clip = 1.0
ema_decay = 0.999
precision = "fp32"

[hte]
k_max = 8
coherence_delta = 0.6
prototype_iters = 25

[evaluation]
alpha = 0.05
n_bootstrap = 2000
n_seeds = 10
init_window = 10
